spring.application.name=finance-tracker
spring.datasource.url=jdbc:h2:mem:financetracker
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Explícito para silenciar o warning de boot. NÃO desligue sem antes resolver o
# mapeamento das rotas de escrita: POST/PUT de transação devolvem a entidade vinda
# do save(), com 'category' ainda como proxy, e TransactionResponse.from() roda no
# controller — fora da sessão. Com false, getType() estoura
# LazyInitializationException (verificado). Para desligar, os writes teriam que
# reler via findByIdWithRelations antes de responder.
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true